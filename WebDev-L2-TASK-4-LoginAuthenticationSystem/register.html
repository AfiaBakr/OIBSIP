<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Auth System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="card">
      <header class="card-header">
        <div class="logo" aria-hidden="true">📝</div>
        <h1>Create an account</h1>
        <p class="subtitle">Register to get access to the dashboard.</p>
      </header>

      <div class="alert" id="form-alert" role="alert" hidden></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
          <p class="field-error" id="username-error"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" required />
            <button type="button" class="toggle-password" aria-label="Show password">Show</button>
          </div>
          <ul class="rules" id="password-rules">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="number">At least 1 number</li>
          </ul>
          <p class="field-error" id="password-error"></p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
          <p class="field-error" id="confirmPassword-error"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <p class="switch">Already have an account? <a href="index.html">Login</a></p>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
